name: kasirpro_universal
description: Aplikasi POS Universal Production-Ready (Retail, F&B, Jasa) dengan SQLite Offline-First & Thermal Printer.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Database & File System
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Security (Salted SHA-256 PIN Hashing)
  crypto: ^3.0.5

  # HTTP Client (BCA Payment Gateway)
  http: ^1.2.2

  # Thermal Printer Bluetooth & Permissions
  print_bluetooth_thermal: ^1.1.1
  permission_handler: ^11.3.1

  # PDF, AirPrint/System Print & Barcode Rendering
  pdf: ^3.11.1
  printing: ^5.13.4
  barcode: ^2.2.8

  # Camera Barcode Scanner
  mobile_scanner: ^5.2.3

  # Formatting, Export CSV/PDF, Share & File Picker
  intl: ^0.19.0
  share_plus: ^10.1.2
  file_picker: ^8.1.4

  # Cupertino Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B1220"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
